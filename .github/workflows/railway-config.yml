name: Railway config

# Plans .railway/railway.ts on PRs and applies the reviewed plan on merge.
# https://github.com/railwayapp/config
#
# The apply job applies the plan artifact pinned to the PR head; it never
# re-evaluates the authoring file. It fails (and you re-plan) if production
# drifted or .railway/ changed after the plan.
#
# Requires RAILWAY_TOKEN as a secret on the GitHub "production" environment:
# a Railway project token for "A220 Stuff", production environment. Both jobs
# declare `environment: production`, so the environment's deployment-branch
# rule must allow PR branches (plan runs on the PR, not on master).

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [master]
    paths:
      - '.railway/**'
      # The railway SDK version changes how railway.ts compiles.
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  plan:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1.2.0
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          cli-version: 5.71.0

  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    # Serialize applies to production. Plans are read-only and stay parallel.
    concurrency:
      group: railway-apply-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1.2.0
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          cli-version: 5.71.0
          # Plans that remove or replace resources (e.g. the Redis volume)
          # fail here instead of applying; run those by hand after review.
          confirm-destructive: false
